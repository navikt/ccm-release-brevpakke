name: deploy brevpakke
on:
  workflow_dispatch:
      inputs:        
        brevpakke:
          type: choice
          required: true
          description: Hvilken brevpakke skal releases?
          options: 
          - arena-brevpakke
          - foreldrepenger-brevpakke
          - gosys-brevpakke
          - melosys-brevpakke
          - pesys01-brevpakke
          - foersteside-brevpakke
          - veiledningarbeid-brevpakke
        
          
jobs:
  deploy:
    runs-on: [self-hosted]
    
    steps:
      - name: Check out private repo # Your user needs access to this repo ( will use your PAT )
        uses: actions/checkout@master
        with:
          repository: navikt/${{ github.event.inputs.brevpakke }}
          token: ${{ secrets.PAT }}
          
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '8'
          overwrite-settings: false # dont overwrite the settings.xml that lives on the runner
          
      - name: Config git author for tags created by mvn release:prepare.
        run: | 
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          
      - name: maven release
        run: |
            mvn release:prepare release:perform
            -Dusername=${{ github.actor }}
            -Dpassword=${{ secrets.PAT }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.PAT }}    
