name: release brevpakke
on:
  workflow_dispatch:
          

jobs:
  deploy:
    runs-on: [self-hosted]
    
    steps:
      - name: Check out private repo # Your user needs access to this repo ( will use your PAT )
        uses: actions/checkout@v2
        with:
          repository: Jonas-Juvet/melosys-brevpakke-fork
          token: ${{ secrets.PAT-jonas }}
          
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '8'
          overwrite-settings: false # dont overwrite the settings.xml that lives on the runner
          
      - name: Config git author for tags created by mvn release:prepare.
        run: | 
          git config user.name "ACTIONS-RUNNER"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          
      - name: maven release
        run: |
            mvn -B release:clean release:prepare release:perform \
            -Dusername=${{ github.actor }} \
            -Dpassword=${{ secrets.PAT-jonas }} \
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.PAT-jonas }}    
